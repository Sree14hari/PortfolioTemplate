<svg width="60" height="64" viewBox="0 0 60 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Spiral wire bindings at top -->
  <rect x="14" y="2" width="4" height="8" rx="2" fill="white" stroke="#1D1D1D" stroke-width="1.5"/>
  <rect x="23" y="2" width="4" height="8" rx="2" fill="white" stroke="#1D1D1D" stroke-width="1.5"/>
  <rect x="32" y="2" width="4" height="8" rx="2" fill="white" stroke="#1D1D1D" stroke-width="1.5"/>
  
  <!-- Notepad paper sheet -->
  <path d="M8 6 H42 C44.2 6 46 7.8 46 10 V52 C46 54.2 44.2 56 42 56 H8 C5.8 56 4 54.2 4 52 V10 C4 7.8 5.8 6 8 6 Z" fill="white" stroke="#1D1D1D" stroke-width="1.6" stroke-linejoin="round"/>
  
  <!-- Ruled horizontal lines -->
  <line x1="10" y1="18" x2="38" y2="18" stroke="#1D1D1D" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="26" x2="36" y2="26" stroke="#1D1D1D" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="34" x2="38" y2="34" stroke="#1D1D1D" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="42" x2="32" y2="42" stroke="#1D1D1D" stroke-width="1.4" stroke-linecap="round"/>
  
  <!-- Tilted pencil on right -->
  <g transform="translate(36, 12) rotate(22)">
    <!-- Eraser -->
    <path d="M0 0 H8 V5 H0 Z" fill="#FFE7A9" stroke="#1D1D1D" stroke-width="1.4"/>
    <!-- Body -->
    <rect x="0" y="5" width="8" height="28" fill="white" stroke="#1D1D1D" stroke-width="1.4"/>
    <line x1="4" y1="5" x2="4" y2="33" stroke="#1D1D1D" stroke-width="1"/>
    <!-- Tip -->
    <polygon points="0,33 8,33 4,41" fill="#FFE7A9" stroke="#1D1D1D" stroke-width="1.4" stroke-linejoin="round"/>
    <polygon points="2.5,37.5 5.5,37.5 4,41" fill="#1D1D1D"/>
  </g>
</svg>

