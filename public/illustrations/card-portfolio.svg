<svg width="72" height="60" viewBox="0 0 72 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Browser window frame -->
  <rect x="2" y="2" width="48" height="42" rx="4" fill="white" stroke="#1D1D1D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top bar divider -->
  <line x1="2" y1="12" x2="50" y2="12" stroke="#1D1D1D" stroke-width="1.4"/>
  <!-- Three dots in top bar -->
  <circle cx="8" cy="7" r="1.4" fill="#1D1D1D"/>
  <circle cx="14" cy="7" r="1.4" fill="#1D1D1D"/>
  <circle cx="20" cy="7" r="1.4" fill="#1D1D1D"/>
  <!-- Small thumbnail / card inside browser -->
  <rect x="8" y="18" width="16" height="18" rx="2" stroke="#1D1D1D" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="10" y1="23" x2="22" y2="23" stroke="#1D1D1D" stroke-width="1.2"/>
  <line x1="10" y1="28" x2="19" y2="28" stroke="#1D1D1D" stroke-width="1.2"/>
  <!-- Wireframe globe overlapping right half -->
  <g transform="translate(36, 14)">
    <circle cx="18" cy="18" r="16" fill="white" stroke="#1D1D1D" stroke-width="1.6"/>
    <!-- Latitude horizontal lines -->
    <line x1="2" y1="18" x2="34" y2="18" stroke="#1D1D1D" stroke-width="1.3"/>
    <ellipse cx="18" cy="18" rx="16" ry="7" stroke="#1D1D1D" stroke-width="1.3"/>
    <!-- Longitude vertical ellipse -->
    <ellipse cx="18" cy="18" rx="7" ry="16" stroke="#1D1D1D" stroke-width="1.3"/>
    <line x1="18" y1="2" x2="18" y2="34" stroke="#1D1D1D" stroke-width="1.3"/>
  </g>
</svg>

